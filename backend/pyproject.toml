[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncboard-backend"
version = "0.1.0"
description = "SyncBoard API — AI-powered real-time collaborative whiteboard backend"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "UNLICENSED" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "redis>=5.2,<6.0",
    "bcrypt>=4.2,<5.0",
    "pyjwt>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25.0",
    "mypy>=1.13,<2.0",
    "aiosqlite>=0.20,<0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "N",             # pep8-naming
]
ignore = [
    "B008", # FastAPI's Depends(...) in defaults is idiomatic
    "N818", # AppException predates this rule; renaming ripples through every
            # route/service that imports it for one stylistic suffix — not
            # worth the diff.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-v --cov=app --cov-report=term-missing"
